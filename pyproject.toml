[tool.pytest.ini_options]
# Deixa os testes fazerem "from src..." a partir da raiz do projeto
pythonpath = ["."]
testpaths = ["tests"]

[tool.pylint.main]
# Nota mínima: o pylint falha (código de saída ≠ 0) se ficar abaixo disto.
# Vale para o PC e para a CI, por isso o ci.yml não repete o limite
fail-under = 8.0

[tool.pylint."messages control"]
# Decisão da equipa: docstrings opcionais; dataclasses, Protocols e modelos Pydantic
# têm poucos métodos de propósito
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]
[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
